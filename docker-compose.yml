version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bio_identifier_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bio_admin
      POSTGRES_PASSWORD: bio_secure_password_2026
      POSTGRES_DB: bio_identifier_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bio_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bio_identifier_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bioidentifier.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_2026
    ports:
      - '5050:80'
    depends_on:
      - postgres
    networks:
      - bio_network

volumes:
  postgres_data:

networks:
  bio_network:
    driver: bridge
